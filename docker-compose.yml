# One command: `docker compose up --build`  ->  open http://localhost:3000
services:
  mongo:
    image: mongo:7
    container_name: motorsport-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"          # lets you also connect with mongosh / Compass / `npm start`
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build: .
    container_name: motorsport-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: motorsport
      PORT: 3000
      # Google sign-in: put these in a .env file next to this one (see .env.example)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    ports:
      - "3000:3000"

volumes:
  mongo-data:
