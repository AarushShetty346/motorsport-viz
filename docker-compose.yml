# One command: `docker compose up --build`  ->  open http://localhost:3000
services:
  mongo:
    image: mongo:7
    container_name: motorsport-mongo
    restart: unless-stopped
    # A single-node replica set, so multi-document transactions work.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"          # lets you also connect with mongosh / Compass / `npm start`
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Starts the replica set the first time (rs.initiate), then reports healthy once it is the primary.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }; quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build: .
    container_name: motorsport-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017/?directConnection=true
      DB_NAME: motorsport
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  mongo-data:
